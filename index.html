<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ПИКАРНЯ</title>

<style>
body{
 font-family:Arial;
 margin:0;
 background:#111;
 color:white;
}

header{
 background:#000;
 padding:15px;
 position:sticky;
 top:0;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
 gap:12px;
 padding:15px;
}

.card{
 background:#222;
 padding:12px;
 border-radius:12px;
}

button{
 background:#c00;
 color:#fff;
 border:none;
 padding:8px 10px;
 border-radius:8px;
 cursor:pointer;
}

#cartPanel{
 display:none;
 position:fixed;
 right:0;
 top:0;
 width:340px;
 height:100%;
 background:#000;
 padding:10px;
 overflow:auto;
}

input,textarea{
 width:100%;
 padding:8px;
 margin:5px 0;
 box-sizing:border-box;
}
</style>
</head>

<body>

<header>
<h2>🍕 ПИКАРНЯ</h2>
<button onclick="toggleCart()">🛒 Корзина (<span id="count">0</span>)</button>
</header>

<div class="grid" id="menu"></div>

<div id="cartPanel">

<h2>🛒 Корзина</h2>
<div id="items">Пусто</div>

<h3>Итого: <span id="total">0</span> ₽</h3>

<h2>💳 Оплата картой</h2>

<input placeholder="Номер карты">
<input placeholder="MM/YY">
<input placeholder="CVV">

<button onclick="pay()">Оплатить</button>

<hr>

<h2>⭐ Отзывы</h2>

<textarea id="review"></textarea>

<button onclick="addReview()">Добавить отзыв</button>

<div id="reviews"></div>

<hr>

<h2>📞 Контакты</h2>

<p>+7 (999) 777-88-99</p>
<p>Работаем 24/7</p>

<button onclick="toggleCart()">Закрыть</button>

</div>
<script>
let cart=[];

const names=[
"Сочная Классика","Острая Пепперони","Четыре Сыра","Мясной Монстр",
"Грибной Лес","Гавайская Взрыв","Морская Легенда","Овощной Бум",
"Барбекю Бомба","Сырный Удар"
];

const descriptions=[
"Свежая моцарелла, томатный соус и ароматные специи.",
"Острая пепперони и двойной слой сыра.",
"Четыре вида сыра на сливочной основе.",
"Ветчина, бекон и фирменный BBQ соус.",
"Отборные грибы и нежный сливочный соус.",
"Сочная ветчина и сладкий ананас.",
"Креветки и морской коктейль.",
"Свежие овощи, оливки и кукуруза.",
"Копчёные колбаски и соус барбекю.",
"Максимум сыра и золотистая корочка."
];

for(let i=1;i<=90;i++){
 let price=300+i*10;
 let name=names[(i-1)%names.length]+" №"+i;
 let desc=descriptions[(i-1)%descriptions.length];

 document.getElementById('menu').innerHTML+=`
 <div class="card">
   <h3>${name}</h3>
   <p>${desc}</p>
   <b>${price} ₽</b><br><br>
   <button onclick="addToCart('${name}',${price})">В корзину</button>
 </div>`;
}

function addToCart(name,price){
 if(cart.length>=20){
   alert('Нельзя добавить больше 20 пицц!');
   return;
 }
 cart.push({name,price});
 renderCart();
}

function toggleCart(){
 let p=document.getElementById('cartPanel');
 p.style.display=p.style.display==='block'?'none':'block';
}

function renderCart(){
 let total=0, html='';

 cart.forEach((x,i)=>{
   total+=x.price;
   html += `${x.name} - ${x.price} ₽ <button onclick="removeItem(${i})">❌</button><br><br>`;
 });

 document.getElementById('items').innerHTML=html || 'Пусто';
 document.getElementById('total').textContent=total;
 document.getElementById('count').textContent=cart.length;
}

function removeItem(i){
 cart.splice(i,1);
 renderCart();
}

function pay(){
 if(cart.length===0){
   alert('Корзина пуста');
   return;
 }

 alert('Оплата прошла успешно ✅');
 cart=[];
 renderCart();
}

function addReview(){
 let t=document.getElementById('review').value;
 if(!t) return;

 document.getElementById('reviews').innerHTML += `<p>⭐ ${t}</p>`;
 document.getElementById('review').value='';
}
</script>

</body>
</html>
