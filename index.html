<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizza PRO+</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#0f0f0f;
    color:#fff;
}

/* HEADER */
header{
    background: linear-gradient(90deg,#e63946,#ff2e63);
    padding:18px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    animation: slideDown .5s ease;
}

@keyframes slideDown{
    from{transform:translateY(-40px);opacity:0}
    to{transform:translateY(0);opacity:1}
}

.container{
    display:flex;
    gap:15px;
    padding:15px;
}

/* BOXES */
.box{
    flex:1;
    background:#1c1c1c;
    border-radius:12px;
    padding:12px;
    animation: fadeIn .6s ease;
}

@keyframes fadeIn{
    from{opacity:0;transform:scale(0.97)}
    to{opacity:1;transform:scale(1)}
}

.pizza{
    background:#2a2a2a;
    padding:10px;
    margin-bottom:10px;
    border-radius:10px;
    transition:.2s;
}
.pizza:hover{
    transform:scale(1.02);
}

button{
    background:#ff2e63;
    border:none;
    color:white;
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
    transition:.2s;
}
button:hover{
    transform:scale(1.05);
}

/* CART */
.cart-item{
    display:flex;
    justify-content:space-between;
    background:#2a2a2a;
    padding:6px;
    border-radius:8px;
    margin-bottom:6px;
}

/* ORDER FORM */
input{
    width:100%;
    padding:8px;
    margin:5px 0;
    border-radius:6px;
    border:none;
}

/* ADMIN */
.admin{
    display:none;
    background:#111;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
}
.small{
    font-size:12px;
    opacity:.7;
}
</style>
</head>

<body>

<header>🍕 PIZZA PRO+</header>

<div class="container">

<!-- MENU -->
<div class="box">
<h3>Меню</h3>

<div class="pizza">
<b>Фирменная</b>
<p>Сыр, соус, тесто</p>
<p>450₽</p>
<button onclick="add('Фирменная',450)">В корзину</button>
</div>

<div class="pizza">
<b>Пепперони</b>
<p>Пепперони + сыр</p>
<p>500₽</p>
<button onclick="add('Пепперони',500)">В корзину</button>
</div>

<div class="pizza">
<b>4 сыра</b>
<p>Сырный микс</p>
<p>520₽</p>
<button onclick="add('4 сыра',520)">В корзину</button>
</div>
</div>

<!-- CART -->
<div class="box">
<h3>Корзина</h3>
<div id="cart"></div>

<p>Скидка: <span id="discount">0</span>%</p>
<p>Доставка: <span id="delivery">0</span>₽</p>
<p><b>Итого: <span id="total">0</span>₽</b></p>

<input id="promo" placeholder="Промокод">
<button onclick="applyPromo()">Применить</button>

<hr>

<h4>Оформление</h4>
<input id="name" placeholder="Имя">
<input id="phone" placeholder="Телефон">
<input id="address" placeholder="Адрес">

<button onclick="order()">Заказать</button>

<hr>
<button onclick="clearCart()">Очистить</button>

<!-- ADMIN -->
<button onclick="openAdmin()">Админ</button>

<div class="admin" id="admin">
<p class="small">Пароль: 1234</p>
<input id="pass" placeholder="Пароль">
<button onclick="adminLogin()">Войти</button>

<div id="adminPanel" style="display:none">
<h4>Заказы</h4>
<div id="orders"></div>
</div>
</div>

</div>

</div>

<script>

let cart = [];
let orders = [];
let discount = 0;

function add(n,p){
    cart.push({n,p});
    render();
}

function render(){
    let c = document.getElementById("cart");
    c.innerHTML = "";

    let sum = 0;

    cart.forEach((i,idx)=>{
        sum += i.p;
        c.innerHTML += `
        <div class="cart-item">
            <span>${i.n} ${i.p}₽</span>
            <button onclick="remove(${idx})">X</button>
        </div>`;
    });

    let delivery = sum > 1200 || sum === 0 ? 0 : 150;

    let total = sum;
    total -= total * discount / 100;
    total += delivery;

    document.getElementById("total").innerText = total;
    document.getElementById("discount").innerText = discount;
    document.getElementById("delivery").innerText = delivery;
}

function remove(i){
    cart.splice(i,1);
    render();
}

function clearCart(){
    cart = [];
    render();
}

function applyPromo(){
    let code = document.getElementById("promo").value;

    if(code === "PIZZA10") discount = 10;
    else if(code === "PIZZA20") discount = 20;
    else discount = 0;

    render();
}

function order(){
    if(cart.length === 0) return alert("Корзина пустая");

    let o = {
        items: cart,
        name: name.value,
        phone: phone.value,
        address: address.value,
        time: new Date().toLocaleString()
    };

    orders.push(o);
    alert("Заказ оформлен!");

    cart = [];
    render();
}

function openAdmin(){
    document.getElementById("admin").style.display = "block";
}

function adminLogin(){
    if(pass.value === "1234"){
        adminPanel.style.display = "block";
        showOrders();
    } else {
        alert("Неверно");
    }
}

function showOrders(){
    let o = document.getElementById("orders");
    o.innerHTML = "";

    orders.forEach((x,i)=>{
        o.innerHTML += `
        <div class="pizza">
            <b>${x.name}</b><br>
            ${x.phone}<br>
            ${x.address}<br>
            <small>${x.time}</small>
        </div>`;
    });
}

</script>

</body>
</html>
